
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Customer - OSRS Gold Management</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111827;
            color: #f9fafb;
        }

        header {
            background: #1f2937;
            padding: 25px;
            border-bottom: 3px solid #d4a017;
        }

        h1, h2 { color: #f5c542; }

        nav {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 20px;
        }

        nav a {
            color: #f5c542;
            text-decoration: none;
        }

        nav a:hover { text-decoration: underline; }

        main {
            max-width: 750px;
            margin: 35px auto;
            padding: 20px;
        }

        .panel {
            background: #1f2937;
            padding: 28px;
            border-radius: 10px;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            color: #e5e7eb;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #64748b;
            border-radius: 5px;
            background: #374151;
            color: white;
            font-size: 15px;
        }

        button {
            margin-top: 25px;
            padding: 13px 22px;
            background: #d4a017;
            color: #111827;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover { background: #f5c542; }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #message {
            margin-top: 20px;
            line-height: 1.5;
        }

        .success { color: #4ade80; }
        .error { color: #f87171; }

        footer {
            text-align: center;
            color: #9ca3af;
            padding: 25px;
        }
    </style>
</head>

<body>

<header>
    <h1>OSRS Gold Management</h1>
    <p>Create a new customer account</p>

    <nav>
        <a href="/osrs-reports.html">Dashboard</a>
        <a href="/create-customer.html">Create Customer</a>
        <a href="/search-customers.html">Search Customers</a>
    </nav>
</header>

<main>
    <section class="panel">

        <h2>Customer Information</h2>

        <form id="customerForm">

            <label for="userName">Username</label>
            <input type="text" id="userName" required maxlength="50">

            <label for="characterName">Character Name</label>
            <input type="text" id="characterName" required maxlength="50">

            <label for="userEmail">Email Address</label>
            <input type="email" id="userEmail" required maxlength="150">

            <label for="userAddress">Address</label>
            <input type="text" id="userAddress" required maxlength="200">

            <label for="goldPurchaseAmount">Gold Purchase Amount</label>
            <input
                    type="number"
                    id="goldPurchaseAmount"
                    min="0"
                    step="any"
                    required
            >

            <button type="submit" id="submitButton">
                Create Customer
            </button>

        </form>

        <p id="message" role="status" aria-live="polite"></p>

    </section>
</main>

<footer>
    OSRS Gold Management System
</footer>

<script>

    const form = document.getElementById("customerForm");

    form.addEventListener("submit", async function(event) {

        event.preventDefault();

        const button = document.getElementById("submitButton");
        const message = document.getElementById("message");

        const customer = {
            userName: document.getElementById("userName").value.trim(),
            characterName: document.getElementById("characterName").value.trim(),
            userEmail: document.getElementById("userEmail").value.trim(),
            userAddress: document.getElementById("userAddress").value.trim(),
            goldPurchaseAmount: Number(
                document.getElementById("goldPurchaseAmount").value
            )
        };

        if (!Number.isFinite(customer.goldPurchaseAmount) ||
            customer.goldPurchaseAmount < 0) {

            message.textContent = "Please enter a valid gold amount.";
            message.className = "error";
            return;
        }

        button.disabled = true;
        message.textContent = "Saving customer...";
        message.className = "";

        try {

            const response = await fetch("/api/users", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(customer)
            });

            const result = await response.json();

            if (!response.ok) {
                throw new Error(
                    result.detail || result.message ||
                    "Unable to create customer."
                );
            }

            message.textContent =
                "Customer " + result.userName +
                " was successfully created!";

            message.className = "success";

            form.reset();

        } catch (error) {

            message.textContent = error.message;
            message.className = "error";

        } finally {

            button.disabled = false;

        }

    });

</script>

</body>
</html>
